<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Rádio Souza Lobo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: #3498db;
            color: #fff;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .player-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 400px;
            width: 100%;
        }
        h1 { margin: 0 0 10px 0; font-size: 28px; letter-spacing: 1px; }
        p { margin: 0 0 30px 0; color: #e0e0e0; font-size: 16px; }
        audio { width: 100%; border-radius: 8px; }
        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #a0d8ff;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h1>Web Rádio Souza Lobo</h1>
        <p>Rádio Escolar • Ao Vivo</p>
        
        <audio controls>
            <source src="yanapak.org" type="audio/mpeg">
            Seu navegador não suporta o reprodutor de áudio.
        </audio>
        <div class="status">📻 Stream ao vivo | Icecast Server</div>
    </div>

</body>
</html>
